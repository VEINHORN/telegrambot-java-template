spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telegrambot}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telegrambot}
    enabled: true
  config:
    import: optional:file:.env[.properties]

app:
  timezone: ${APP_TIMEZONE:UTC}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
